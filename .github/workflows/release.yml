name: Release

# Każda zmiana na main z nową wersją w manifest.json publikuje wydanie vX.Y.Z
# (razem z tagiem), które HACS pokazuje jako aktualizację. Jeśli wydanie dla
# tej wersji już istnieje, nic się nie dzieje.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Opublikuj wydanie dla wersji z manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version custom_components/energy_billing/manifest.json)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Wydanie $tag już istnieje - pomijam."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
